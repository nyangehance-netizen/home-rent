# Builds an installable Android APK on every push to main (or when you press "Run workflow").
# The APK is attached to a GitHub Release, so you can download it on your phone from:
#   https://github.com/<you>/<repo>/releases/latest
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_SUPABASE_URL   your Supabase project URL
#   EXPO_PUBLIC_SUPABASE_KEY   your Supabase anon / publishable key
# Without them the APK still builds; the app will say it is not connected to its database.

name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Write app settings
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_KEY" > .env
          if [ -z "$SUPABASE_URL" ]; then echo "::warning::Supabase secrets are not set. The APK will build but show 'not connected'."; fi

      - name: Install packages
        run: scripts/ci-run.sh "Install packages" npm install --no-audit --no-fund

      - name: Check package versions against Expo SDK
        continue-on-error: true
        run: scripts/ci-run.sh "Version check" npx expo install --check

      - name: Generate Android project
        run: scripts/ci-run.sh "Generate Android project" npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: cd android && ../scripts/ci-run.sh "Build APK" ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/kodi-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kodi-apk
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Kodi preview ${{ github.run_number }}
          make_latest: true
          files: dist/*.apk
          body: |
            Preview build of Kodi for Android.

            **Install:** open this page on your Android phone, tap `kodi-${{ github.run_number }}.apk`, then open the download. If asked, allow your browser to install unknown apps.

            Built from commit ${{ github.sha }}.

      - name: Summary
        run: |
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download on your phone: https://github.com/${{ github.repository }}/releases/latest" >> "$GITHUB_STEP_SUMMARY"
